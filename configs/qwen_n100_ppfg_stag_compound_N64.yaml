# Reviewer-#2 E4 (Day-20): PPFG-stag-compound at N=64 on MATH500 first-100.
#
# Tests whether the compound-gate's structural emptiness at N=8 (5 firings /
# 300 problems on Day-11 Phase 6) is a population-density artifact. At N=64,
# the candidate donor-target pairing space grows ~8x; if the compound gate
# fires meaningfully often without cratering false-positive control, that
# rescues §5.3.2 (§5.3.2 is currently "structurally empty parameter space").
#
# If the compound gate stays inert at N=64 (firing rate < 1% of problems, or
# Pass@k delta within seed-sigma), the structural-emptiness verdict holds
# across an 8x larger population — strong evidence the verdict is not a
# low-density artifact.

defaults:
  - ppfg_stag_compound

experiment:
  name: "qwen_n100_ppfg_stag_compound_N64_math500"

model:
  base_model: "Qwen/Qwen2.5-7B-Instruct"
  gpu_memory_utilization: 0.65

population:
  n_chains: 64

ppfg:
  prm_low_t: 0.60
  prm_flat_t: 0.05
  headroom_budget: 4
  liveness_min: 3

task:
  name: "math500"
  n_problems: 100
